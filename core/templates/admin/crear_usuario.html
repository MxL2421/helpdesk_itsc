{% extends 'base.html' %}
{% block title %}Crear Usuario{% endblock %}
 
{% block content %}
<div class="border border-gray-300 rounded-lg p-4 bg-gray-100 max-w-2xl mx-auto m-8">
  <h1 class="text-red-600 font-semibold mb-4">Crear Usuario</h1>
  <form method="post" class="form-usuario">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="flex gap-2 mt-4">
      <button type="submit" onclick="this.disabled=true; this.form.submit();"
        class="bg-red-600 text-white px-4 py-2 rounded text-sm hover:bg-red-700">
        Crear usuario
      </button>
      <a href="{% url 'admin_usuarios' %}" class="bg-gray-200 text-gray-700 px-4 py-2 rounded text-sm hover:bg-gray-300">
        Cancelar
      </a>
    </div>
  </form>
</div>
 
<style>
  .form-usuario p {
    margin-bottom: 1.1rem;
  }
  .form-usuario label {
    display: block;
    font-size: 0.875rem;
    font-weight: 500;
    color: #374151;
    margin-bottom: 0.3rem;
  }
  .form-usuario input,
  .form-usuario select {
    width: 100%;
    max-width: 320px;
    border: 1px solid #d1d5db;
    border-radius: 0.375rem;
    padding: 0.5rem 0.75rem;
    font-size: 0.875rem;
  }
  .form-usuario input:focus,
  .form-usuario select:focus {
    outline: none;
    border-color: #dc2626;
    box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.25);
  }
  .form-usuario .helptext {
    display: block;
    font-size: 0.75rem;
    color: #6b7280;
    margin-top: 0.25rem;
  }
  .form-usuario ul.errorlist {
    color: #dc2626;
    font-size: 0.75rem;
    margin: 0.25rem 0 0 0;
    padding-left: 0;
    list-style: none;
  }
</style>
 
<script>
  function actualizarCampos() {
    const rol = document.querySelector('[name="rol"]').value;

    const filaMat = document.getElementById('id_matricula')?.closest('p');
    const filaCarr = document.getElementById('id_carrera')?.closest('p');
    const filaAreas = document.getElementById('id_areas')?.closest('ul')?.parentElement ||
                      document.getElementById('id_areas')?.closest('p');

    // Ocultar todo primero
    if (filaMat) filaMat.style.display = 'none';
    if (filaCarr) filaCarr.style.display = 'none';
    if (filaAreas) filaAreas.style.display = 'none';

    // Estudiante: matrícula y carrera
    if (rol === 'estudiante') {
      if (filaMat) filaMat.style.display = '';
      if (filaCarr) filaCarr.style.display = '';
    }

    // Técnico: áreas
    else if (rol === 'tecnico') {
      if (filaAreas) filaAreas.style.display = '';
    }

    // Maestro y administrador:
    // no muestran matrícula, carrera ni áreas
  }

  document.querySelector('[name="rol"]').addEventListener('change', actualizarCampos);
  actualizarCampos();
</script>
 
{% endblock %}
