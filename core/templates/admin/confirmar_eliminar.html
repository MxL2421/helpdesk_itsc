{% extends 'base.html' %}
{% block title %}Confirmar eliminación{% endblock %}

{% block content %}
<div class="border border-gray-300 rounded-lg p-6 bg-gray-100 max-w-md mx-auto m-8">
  <h1 class="text-red-500 font-semibold mb-2">⚠️ Confirmar eliminación</h1>
  <p class="text-sm text-gray-700 mb-4">
    Estás a punto de eliminar <strong>{{ objeto }}</strong>. Esta acción no se puede deshacer.
    Introduce tu contraseña para confirmar.
  </p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="flex gap-2 mt-4">
      <button type="submit" onclick="this.disabled=true; this.form.submit();"
        class="bg-red-600 text-white px-4 py-2 rounded text-sm hover:bg-red-700">
        Confirmar eliminación
      </button>
      <a href="{% url 'admin_usuarios' %}" class="bg-gray-200 text-gray-700 px-4 py-2 rounded text-sm hover:bg-gray-300">
        Cancelar
      </a>
    </div>
  </form>
</div>
{% endblock %}
