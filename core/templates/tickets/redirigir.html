{% extends 'base.html' %}
{% block title %}Redirigir Ticket{% endblock %}

{% block content %}
<div class="border border-gray-300 rounded-lg p-4 bg-gray-100 max-w-xl mx-auto m-8">
  <h1 class="text-red-500 font-semibold mb-4">Redirigir Ticket: {{ ticket.titulo }}</h1>

  <form method="post">
    {% csrf_token %}

    <!-- Área -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Área</label>
      {{ form.area }}
    </div>

    <!-- Categoría -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Categoría</label>
      {{ form.categoria }}
    </div>

    <div class="flex gap-2 mt-4">
      <button type="submit" onclick="this.disabled=true; this.form.submit();"
        class="bg-red-600 text-white px-4 py-2 rounded text-sm hover:bg-red-700">
        Redirigir
      </button>
      <a href="{% url 'detalle_ticket' ticket.id %}"
        class="bg-gray-200 text-gray-700 px-4 py-2 rounded text-sm hover:bg-gray-300">
        Cancelar
      </a>
    </div>
  </form>
</div>

<script>
  const areaSelect = document.getElementById('id_area_redirigir');
  const categoriaSelect = document.getElementById('id_categoria_redirigir');

  const todasCategorias = [
    {% for cat in categorias %}
    { id: {{ cat.id }}, nombre: '{{ cat.nombre }}', area: {% if cat.area_id %}{{ cat.area_id }}{% else %}null{% endif %} },
    {% endfor %}
  ];

  function filtrarCategorias() {
    const areaId = parseInt(areaSelect.value);
    categoriaSelect.innerHTML = '<option value="">---------</option>';

    if (!areaId) return;

    todasCategorias.forEach(cat => {
      if (cat.area === areaId) {
        const option = document.createElement('option');
        option.value = cat.id;
        option.textContent = cat.nombre;
        categoriaSelect.appendChild(option);
      }
    });
  }

  areaSelect.addEventListener('change', filtrarCategorias);
  filtrarCategorias();
</script>

{% endblock %}
