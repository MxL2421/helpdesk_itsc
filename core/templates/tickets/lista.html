{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <title>mis reportes</title>
</head>
<body>
  <header class="bg-white border border-gray-300 ">
    <div class="flex items-center h-20 px-6 gap-4">
     <img src="{% static 'img/logo.png' %}" alt="Logo" class="h-20 w-auto">
      <span class="text-sm font-normal text-gray-800 self-end mb-1 -ml-6  ">
        Usuario
      </span>
    </div>
  </header>

  <!-- CONTENEDOR QUE UNE EL NAV Y EL CONTENIDO -->
  <div class="flex">

    <!-- RECTÁNGULO VERTICAL: Menú -->
    <nav class="bg-gray-50 border border-gray-300 w-48 h-screen">
      <ul class="p-4 space-y-8">
        <li>
          <a href="#" class="flex flex-col items-center text-gray-700 hover:text-red-600">
            <img src="{% static 'img/inicio.png' %}" alt="Inicio" class="h-10 w-auto mb-1">
            <span class="text-sm">Inicio</span>
          </a>
        </li>
        <li>
          <a href="{% url 'crear_ticket' %}" class="flex flex-col items-center text-gray-700 hover:text-red-600">
            <img src="{% static 'img/crear.png' %}" alt="Logo" class="h-10 w-auto">
            <span class="text-sm">Crear nuevo ticket</span>
          </a>
        </li>
        <li>
          <a href="{% url 'lista_tickets' %}" class="flex flex-col items-center text-gray-700 hover:text-red-600">
            <img src="{% static 'img/historiar.png' %}" alt="Logo" class="h-10 w-auto">
            <span class="text-sm">Mis tickets</span>
          </a>
        </li>
        <li>
          <a href="#" class="flex flex-col items-center text-gray-700 hover:text-red-600">
            <img src="{% static 'img/ayuda.png' %}" alt="Logo" class="h-10 w-auto">
            <span class="text-sm">Ayuda</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- Cuadro de Mis Reportes -->
    <div class="border border-gray-300 rounded-lg p-4 bg-gray-100 flex-1 m-8">
      <h1 class="text-center text-red-500 font-semibold mb-8">Mis Reportes</h1>

      <table class="w-full bg-white rounded">
        <thead class="bg-gray-300">
          <tr>
            <th class="p-2 text-sm">Ticket</th>
            <th class="p-2 text-sm">Asunto</th>
            <th class="p-2 text-sm">Categoría</th>
            <th class="p-2 text-sm">Estado</th>
            <th class="p-2 text-sm">Prioridad</th>
          </tr>
        </thead>
        <tbody>
          {% for ticket in tickets %}
          <tr class="border-t">
            <td class="p-2 text-sm">{{ ticket.id }}</td>
            <td class="p-2 text-sm">{{ ticket.asunto }}</td>
            <td class="p-2 text-sm">{{ ticket.categoria }}</td>
            <td class="p-2 text-sm">{{ ticket.estado }}</td>
            <td class="p-2 text-sm">{{ ticket.prioridad }}</td>
          </tr>
          {% endfor %}
          
        </tbody>
      </table>
    </div>

  </div>

</body>
</html>
